name: CI

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch vendor bundles
        run: npm run fetch-deps

      - name: Run unit tests
        run: npm test

      - name: Store pack (strict)
        run: npm run check:store && node tools/pack-extension.mjs --strict

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Google Chrome
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome
        with:
          install-dependencies: true

      - name: Export Chrome path
        run: echo "CHROME_PATH=${{ steps.setup-chrome.outputs.chrome-path }}" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm ci

      - name: Fetch vendor bundles
        run: npm run fetch-deps

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run smoke tests
        run: xvfb-run npm run test:e2e
