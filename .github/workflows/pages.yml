name: Verify privacy docs

# GitHub Pages is served from main → /docs (Settings → Pages).
# No deploy step required — push updates to docs/ on main go live automatically.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'PRIVACY.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check privacy files exist
        run: |
          test -f docs/privacy.html
          test -f docs/index.html
          grep -q 'privacy.html' docs/index.html
          echo "Privacy docs OK — served from Settings → Pages → main → /docs"
