<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vox Reader smoke fixture</title>
</head>
<body>
  <script>
    Object.defineProperty(window, '__voxReaderLoaded', {
      get: () => document.documentElement.dataset.voxReaderLoaded === 'true',
    });
  </script>
  <article>
    <h1>Smoke test article</h1>
    <p>The quick brown fox jumps over the lazy dog. This paragraph is long enough for Vox Reader to wrap and read aloud during automated smoke tests.</p>
    <p>Second paragraph for selection and playback checks.</p>
  </article>
  <iframe id="same-origin-frame" title="fixture frame" srcdoc="<p>First iframe sentence for highlight tests. Second sentence continues the selection.</p>"></iframe>
</body>
</html>
