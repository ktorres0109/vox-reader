<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vox Reader chat fixture</title>
</head>
<body>
  <main>
    <div data-message-author-role="user"><p>User question about smoke testing the reader extension.</p></div>
    <div data-message-author-role="assistant">
      <p>First assistant reply with enough words for Vox Reader to wrap and detect this chat message as readable content.</p>
    </div>
    <div data-message-author-role="assistant">
      <p>Second assistant reply is the latest message and should be the only one read when latest-only chat scope is selected.</p>
    </div>
  </main>
</body>
</html>
